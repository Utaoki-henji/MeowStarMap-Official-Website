.cover-grid>:first-child,.mod-grid>:first-child,.skel-grid>:first-child{grid-column:auto;grid-row:auto}
.cover-grid>:first-child{min-height:420px}
.cover-grid>:first-child .ms-cover{aspect-ratio:1/1;flex:0 0 auto}
.skel-grid>:first-child .skel-cover{aspect-ratio:1/1;flex:0 0 auto}
.mod-grid>:first-child{min-height:220px}
}
}
/* 降低透明度偏好下重申面板让位（与 L518~525 / L955~963 的实底回落口径并存，不引玻璃） */
@media (prefers-reduced-transparency:reduce){
body[data-view="home"] .wrap-home,body[data-view="dev"] .wrap-dev{background:var(--bg)}
html[data-theme="dark"] body[data-view="home"] .wrap-home,html[data-theme="dark"] body[data-view="dev"] .wrap-dev{background:var(--bg)}
}
/* ═══════ R37:END ═══════ */
/* ═══════ R38:BEGIN 全站 Apple 收官 + 三态外观（20261027）═══════
   作用域：非 landing 全站表面 + landing 的排版/按钮/AA 收口 + 右上角外观菜单。
   neutral 为默认；color 恢复原有彩色氛围；plain 去色。状态优先级：
   data-theme（明暗） > data-look（色彩处理） > lp-theme（仅 landing）。
   回滚 = 删除本注释对 + R38-UI 注释对 + 还原 html 的 data-look 与 head 主题脚本两处。
   R38 新规则零 hex；hex 仅允许出现在下方 :root 的 token 定义。
   R37 锁定项（--bg/--card、两网格、.sec-tip margin、gate/pagecard/quick/step 半径）不动。
   ═══════ R38 头注结束 ═══════ */
:root{
  --font-en:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --lp-font:var(--font-sans);
  --type-hero:clamp(2rem,6vw,4.75rem);
  --type-dev:clamp(2.25rem,4.4vw,3.75rem);
  --type-gate:clamp(2.5rem,7vw,4.5rem);
  --type-h1:clamp(1.9rem,3.6vw,3rem);
  --type-h2:clamp(1.35rem,2.4vw,1.75rem);
  --type-body:1rem;
  --type-small:.875rem;
  --type-caption:.8125rem;
  --type-eyebrow:.75rem;
  --lh-heading:1.14;
  --lh-body:1.75;
  --tracking-heading:-.02em;
  --tracking-display:-.035em;
  --sp-section:clamp(48px,7vw,88px);
  --r-panel:28px;
  --r-panel-sm:22px;
  --color-ink-on-dark:var(--color-neutral-1);
  --color-ink-on-dark-2:rgba(235,235,245,.72);
  --color-line-on-dark:rgba(255,255,255,.18);
  --color-surface-on-dark:rgba(255,255,255,.06);
  --color-action-1:#8ECBFF;
  --color-action-2:#79BFFB;
  --color-action-ink:#0B2E4F;
  --gradient-hero-color:linear-gradient(135deg,#eaf1ff 0%,#f7faff 55%,#fff 100%);
  --gradient-hero-color-dark:linear-gradient(135deg,#1a2440 0%,#151b2e 55%,#121828 100%);
  --gradient-dev-color:linear-gradient(135deg,#f4eeff 0%,#faf8ff 55%,#fff 100%);
  --gradient-dev-color-dark:linear-gradient(135deg,#231c44 0%,#191531 55%,#131022 100%);
}

/* ── 字体与层级 ── */
body{font-family:var(--font-sans,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif);font-size:var(--type-body,1rem);line-height:var(--lh-body,1.75)}
h1,h2,h3{font-family:var(--font-sans,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14)}
h1.page-title{font-size:var(--type-h1,1.9rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14);margin:var(--sp-1) 0 10px}
.hero h1{font-size:var(--type-hero,2rem);font-weight:700;letter-spacing:var(--tracking-display,-.035em);line-height:var(--lh-heading,1.14);margin:8px 0 12px}
.dev-hero h1.page-title{font-size:var(--type-dev,2.25rem);font-weight:700;letter-spacing:var(--tracking-display,-.035em);line-height:var(--lh-heading,1.14);margin:0 0 12px}
.gate h1{font-size:var(--type-gate,2.5rem);font-weight:700;letter-spacing:var(--tracking-display,-.035em);line-height:var(--lh-heading,1.14);margin:14px 0 10px}
.lp-title{font-family:var(--font-en,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);font-weight:700;letter-spacing:var(--tracking-display,-.035em)}
.lp-brand{font-family:var(--font-en,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)}
.lp-eyebrow{font-size:var(--type-eyebrow,.75rem);font-weight:600;letter-spacing:.14em}
.lp-theme-slim,.lp-theme-spectrum{--lp-eyebrow-ink:var(--color-slim-1);--lp-foot-ink:var(--color-slim-1)}
.lp-theme-slim{--lp-title-grad:linear-gradient(90deg,var(--color-energy-3),var(--color-stage-2),var(--color-portrait-2),var(--color-hello-3));--lp-grad-fallback:var(--color-portrait-2)}
html[data-theme="dark"] .lp-theme-slim{--lp-title-grad:linear-gradient(90deg,var(--color-stage-1),var(--color-stage-2),var(--color-stage-3),var(--color-stage-4));--lp-grad-fallback:var(--color-stage-1)}
.lp-theme-energy{--lp-title-grad:linear-gradient(90deg,var(--color-energy-4),var(--color-energy-2),var(--color-energy-1));--lp-grad-fallback:var(--color-energy-2)}
.lp-theme-deep{--lp-eyebrow-ink:var(--color-neutral-1);--lp-foot-ink:var(--color-neutral-1)}
.hero-sub,.dev-hero-sub,.lead,.gate-sub{font-weight:300}
.hero-sub{font-size:clamp(1rem,1.25vw,1.125rem);line-height:1.7}
.dev-hero-sub{font-size:clamp(1rem,1.2vw,1.0625rem);line-height:1.7}
.lead{font-size:clamp(1rem,1.2vw,1.0625rem);line-height:1.75;color:var(--mut)}
.gate-sub{font-size:var(--type-body,1rem)}
.sec-tip{font-size:var(--type-small,.875rem)}
.crumbs{font-size:var(--type-eyebrow,.75rem);font-weight:500;letter-spacing:.02em;color:var(--mut)}
.hero-badges span{font-size:var(--type-eyebrow,.75rem);font-weight:500;letter-spacing:.08em}
.dev-stats .stat b{font-family:var(--font-en,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);font-weight:600;font-variant-numeric:tabular-nums}

/* ── 页面环境与装饰层 ── */
html[data-look="neutral"] body:not([data-view="landing"])::before{background:linear-gradient(180deg,var(--color-neutral-1) 0%,var(--color-neutral-2) 100%)}
html[data-theme="dark"][data-look="neutral"] body:not([data-view="landing"])::before{background:var(--bg)}
html[data-look="plain"]:not([data-theme="dark"]) body:not([data-view="landing"])::before{background:var(--color-neutral-1)}
html[data-theme="dark"][data-look="plain"] body:not([data-view="landing"])::before{background:var(--bg)}
html[data-look="neutral"] body::after,html[data-look="plain"] body::after{display:none}
html[data-look="neutral"] #bg-blobs,html[data-look="neutral"] #atmos,html[data-look="plain"] #bg-blobs,html[data-look="plain"] #atmos{display:none}
html[data-look="plain"] ::selection{background:var(--tx);color:var(--card)}

/* ── 教程首页 hero ── */
.hero,body[data-view="home"] .hero,html[data-theme="dark"] .hero,html[data-theme="dark"] body[data-view="home"] .hero{
  position:relative;isolation:isolate;overflow:hidden;background:var(--card);background-image:none;
  border:1px solid var(--bd);border-radius:var(--r-panel,28px);box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  padding:clamp(28px,4.5vw,52px);margin-bottom:var(--sp-section,88px)
}
.hero::before{content:"TUTORIAL";position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-en,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);font-weight:800;font-size:clamp(88px,20vw,240px);line-height:1;letter-spacing:-.04em;white-space:nowrap;color:var(--tx);opacity:.035;pointer-events:none;user-select:none}
.hero>*{position:relative;z-index:1}

/* ── 开发者 hero ── */
.dev-hero,body[data-view="dev"] .dev-hero,html[data-theme="dark"] .dev-hero,html[data-theme="dark"] body[data-view="dev"] .dev-hero{
  position:relative;isolation:isolate;overflow:hidden;background:var(--color-neutral-3);background-image:none;
  border:1px solid var(--color-line-on-dark);border-radius:var(--r-panel,28px);box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--color-ink-on-dark);
  padding:clamp(28px,4.5vw,52px);margin-bottom:var(--sp-section,88px)
}
.dev-hero::before{content:"DEVELOPER";position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-en,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);font-weight:800;font-size:clamp(80px,18vw,230px);line-height:1;letter-spacing:-.04em;white-space:nowrap;color:var(--color-ink-on-dark);opacity:.05;pointer-events:none;user-select:none}
.dev-hero>*{position:relative;z-index:1}
.dev-hero .page-title{color:var(--color-ink-on-dark)}
.dev-hero .dev-hero-sub,html[data-theme="dark"] .dev-hero .dev-hero-sub{color:var(--color-ink-on-dark-2)}
.dev-hero .dev-badge,html[data-theme="dark"] .dev-hero .dev-badge{background:transparent;border:1px solid var(--color-line-on-dark);color:var(--color-ink-on-dark-2);border-radius:var(--r-full)}
.dev-hero .dev-stats .stat,html[data-theme="dark"] .dev-hero .dev-stats .stat{background:var(--color-surface-on-dark);border:1px solid var(--color-line-on-dark);border-radius:var(--r-panel-sm,22px);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.dev-hero .dev-stats .stat b,html[data-theme="dark"] .dev-hero .dev-stats .stat b{color:var(--color-ink-on-dark);background-image:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:currentColor}
.dev-hero .dev-stats .stat i{color:var(--color-ink-on-dark-2)}

/* ── 身份门 ── */
.gate-role,html[data-theme="dark"] .gate-role{background:var(--card);border:1px solid var(--bd);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:clamp(22px,2.8vw,32px)}
.gate-role::before,html[data-theme="dark"] .gate-role::before{display:none}
.gate-role:hover,html[data-theme="dark"] .gate-role:hover{box-shadow:none;transform:translateY(-2px);border-color:var(--ac)}
.gate-role.is-dev:hover,html[data-theme="dark"] .gate-role.is-dev:hover{border-color:var(--dvc);box-shadow:none}
.gate-emoji{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:22px;background:var(--bg);border:1px solid var(--bd);font-size:36px;line-height:1}
.gr-emoji,.gate-role.is-dev .gr-emoji{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:18px;background:var(--bg);border:1px solid var(--bd);font-size:28px;line-height:1}
.gate-role .gr-name{font-size:clamp(1.25rem,1.8vw,1.5rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:1.25}
.gate-role .gr-desc{font-size:var(--type-small,.875rem);line-height:1.65}
.gate-role .gr-go{font-size:var(--type-small,.875rem);font-weight:600}

/* ── 阅读面板与按钮 ── */
.wrap{border:1px solid var(--bd);border-radius:var(--r-panel,28px);box-shadow:none}
.lp-cta,.lp-dl-btn{border-radius:var(--r-full)}
.lp-dl-btn,html[data-theme="dark"] .lp-dl-btn{background:var(--color-action-1);color:var(--color-action-ink);box-shadow:none}
.lp-dl-btn:hover,html[data-theme="dark"] .lp-dl-btn:hover{background:var(--color-action-2);color:var(--color-action-ink)}

/* ── 列表卡、快捷卡、步骤 ── */
.pagecard{background:var(--bg);border:1px solid var(--bd);border-radius:24px;box-shadow:none;padding:20px 22px}
.pagecard:hover{background:var(--card);border-color:var(--ac);box-shadow:none;transform:translateY(-2px)}
.pc-no{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px}
body[data-view="dev"] .pc-no{background:var(--card);color:var(--tx);border-color:var(--bd)}
.pc-d{font-size:var(--type-caption,.8125rem);line-height:1.6}
.quick{background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:none}
.quick:hover{background:var(--card);border-color:var(--ac);box-shadow:none;transform:translateY(-2px)}
.q-emoji{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);font-size:20px;flex:none}
.q-body b{font-weight:600}
.step{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:none}
.step:hover{border-color:var(--ac);box-shadow:none;transform:translateY(-2px)}
.step-no{background:var(--tx);color:var(--card)}

/* ── 目录、相关阅读、概览、翻页 ── */
.doc-toc,.doc-toc-m{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-panel-sm,22px);box-shadow:none}
html[data-theme="dark"] .doc-toc,html[data-theme="dark"] .doc-toc-m{background:var(--bg);border-color:var(--bd)}
.doc-toc b,.doc-toc-m summary{font-size:var(--type-eyebrow,.75rem);font-weight:600;letter-spacing:.06em}
.doc-toc a,.doc-toc-m a{font-size:var(--type-caption,.8125rem)}
.doc-toc a.toc-lv1,.doc-toc-m a.toc-lv1{color:var(--tx);font-weight:600}
.doc-toc a:hover,.doc-toc-m a:hover{color:var(--dvc-deep)}
.rel,.mod-overview,.faq-index{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-panel-sm,22px);box-shadow:none}
html[data-theme="dark"] .rel,html[data-theme="dark"] .mod-overview,html[data-theme="dark"] .faq-index{background:var(--bg);border-color:var(--bd)}
.rel a,.mod-rel a{background:var(--card);border-color:var(--bd);color:var(--tx)}
html[data-theme="dark"] .rel a,html[data-theme="dark"] .mod-rel a{background:var(--card);border-color:var(--bd);color:var(--tx)}
.pager a{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-panel-sm,22px);box-shadow:none}
.pager a:hover{background:var(--card);border-color:var(--ac);box-shadow:none;transform:translateY(-2px)}
html[data-theme="dark"] .pager a:hover{background:var(--card);border-color:var(--ac);box-shadow:none}

/* ── 正文与文档 ── */
.page-body{font-size:var(--type-body,1rem);line-height:var(--lh-body,1.75)}
.page-body h3{font-size:var(--type-h2,1.35rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14)}
.page-body blockquote,html[data-theme="dark"] .page-body blockquote{background:var(--bg);border-left:2px solid var(--color-slim-3);border-radius:0 var(--r-md) var(--r-md) 0;color:var(--tx)}
.hero-notes blockquote,html[data-theme="dark"] .hero-notes blockquote{background:var(--bg);border-left:2px solid var(--color-slim-3);border-radius:0 var(--r-md) var(--r-md) 0;color:var(--tx)}
.page-body img{border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:none}
.page-body th,html[data-theme="dark"] .page-body th{background:var(--bg);color:var(--tx)}
.page-body tr:nth-child(even) td,html[data-theme="dark"] .page-body tr:nth-child(even) td{background:var(--bg)}
.doc-article h2{font-size:var(--type-h2,1.35rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14);color:var(--tx);border-left:0;padding-left:0;margin:var(--sp-6) 0 var(--sp-3)}
.doc-article h4{font-size:1.0625rem;font-weight:600;color:var(--tx);margin:26px 0 10px}
.doc-article h5{font-size:.9375rem;font-weight:600;color:var(--tx);margin:22px 0 8px}
.allpage h3{font-size:var(--type-h2,1.35rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14);border-left:0;padding-left:0;color:var(--tx)}
.allwrap .allpage{background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:none}
.allwrap h2.allmod{background:none;border-radius:0;padding:0 0 var(--sp-3);border-bottom:1px solid var(--bd);font-size:clamp(1.75rem,3vw,2.5rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14);color:var(--tx);margin:0 0 var(--sp-5)}
.home-sec{margin:var(--sp-section,88px) 0}
.home-sec h2{font-size:var(--type-h2,1.35rem);font-weight:600;letter-spacing:var(--tracking-heading,-.02em);line-height:var(--lh-heading,1.14)}
.home-foot{margin-top:var(--sp-section,88px)}

/* ── 标签与社交按钮 ── */
.kb-chip{background:var(--bg);border:1px solid var(--bd);color:var(--color-slim-1);border-radius:var(--r-full)}
html[data-theme="dark"] .kb-chip{background:var(--bg);border-color:var(--bd);color:var(--color-slim-3)}
.dm-chip{background:var(--bg);border:1px solid var(--bd);color:var(--color-slim-1);border-radius:var(--r-full)}
html[data-theme="dark"] .dm-chip{background:var(--bg);border-color:var(--bd);color:var(--color-slim-3)}
.about-soc-btn,html[data-theme="dark"] .about-soc-btn{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-full);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

/* ── AA 辅助字：亮灰底用 slim-1，暗底用 slim-3 ── */
.hero-badges span,.sec-tip,.home-foot,.print-tip,.gate-sub,.gate-hint,.gate-current,.rel b,.mod-rel b,.pc-d,.doc-toc b,.doc-toc a,.doc-toc-m summary,.doc-toc-m a,.look-menu-h,.look-opt i{color:var(--color-slim-1)}
html[data-theme="dark"] .hero-badges span,html[data-theme="dark"] .sec-tip,html[data-theme="dark"] .home-foot,html[data-theme="dark"] .print-tip,html[data-theme="dark"] .gate-sub,html[data-theme="dark"] .gate-hint,html[data-theme="dark"] .gate-current,html[data-theme="dark"] .rel b,html[data-theme="dark"] .mod-rel b,html[data-theme="dark"] .pc-d,html[data-theme="dark"] .doc-toc b,html[data-theme="dark"] .doc-toc a,html[data-theme="dark"] .doc-toc-m summary,html[data-theme="dark"] .doc-toc-m a,html[data-theme="dark"] .look-menu-h,html[data-theme="dark"] .look-opt i{color:var(--color-slim-3)}
.doc-toc a.toc-lv1,.doc-toc-m a.toc-lv1{color:var(--tx)}
.alllink,.gate-back,.sb-home.active,.sb-all:hover,.sb-mod.active>.sb-modlink,.sb-pages a.active,.hero-dot{color:var(--ac-deep)}

/* ── 外观菜单（R38-UI 注入） ── */
.look-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 9px;border:1px solid var(--bd);border-radius:var(--r-full);background:var(--card);color:var(--color-neutral-3);font:inherit;font-size:var(--type-eyebrow,.75rem);font-weight:600;cursor:pointer;flex:none;transition:border-color .2s var(--ease),background .2s var(--ease)}
html[data-theme="dark"] .look-btn{color:var(--color-neutral-1)}
.look-btn:hover{border-color:var(--ac)}
.look-btn svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.look-btn-dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--bd);background:var(--color-neutral-2)}
html[data-look="neutral"] .look-btn-dot{background:linear-gradient(90deg,var(--color-neutral-1) 50%,var(--color-neutral-3) 50%)}
html[data-look="color"] .look-btn-dot{background:linear-gradient(90deg,var(--color-stage-1),var(--color-stage-3),var(--color-stage-4))}
html[data-look="plain"] .look-btn-dot{background:var(--color-neutral-1)}
html[data-theme="dark"][data-look="plain"] .look-btn-dot{background:var(--color-neutral-3)}
.look-menu{position:fixed;z-index:85;width:min(304px,calc(100vw - 24px));padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-panel-sm,22px);box-shadow:var(--sh-2)}
.look-menu[hidden]{display:none!important}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .look-menu{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
}

/* ═══════ R39:BEGIN 苹果式排版整改层（20261028）
   范围：全站字号阶梯、T 基准间距、三级层级、正文行宽、左对齐配图与移动端留白。

@media screen{
:root{
  --type-eyebrow:clamp(13px,1vw,14px);

  --type-gate:clamp(2.5rem,5.2vw,4.5rem);
  --type-display:clamp(2.75rem,9.2vw,8rem);
  --lh-body:1.6;
  --lh-heading:1.16;
  --space-title-top:.5em;
  --space-title-bottom:.75em;

body{font-size:var(--type-body);line-height:var(--lh-body)}

.page-body{font-size:var(--type-body);line-height:var(--lh-body)}

.lpx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 24px;border-radius:var(--r-full);font-size:15px;font-weight:600;text-decoration:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.lpx-btn.primary{background:var(--ac);color:#fff;box-shadow:var(--sh-ac)}
.lpx-btn.secondary{border:1px solid var(--bd);color:var(--tx);background:transparent}
.lpx-btn:hover{opacity:.82}
.lpx-btn:active{transform:scale(.98)}
.lp-foot{display:flex;flex-direction:column;align-items:center}
.lp-footnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;width:min(760px,100%);margin:0 auto 28px;text-align:left}
.lp-footnav h3{margin:0 0 10px;color:var(--tx);font-size:13px;font-weight:700}
.lp-footnav a{display:block;margin:7px 0;color:var(--mut);font-size:13px;text-decoration:none}
.lp-footnav a:hover{color:var(--ac)}
.lp-footnote{margin:0;color:var(--mut);font-size:12.5px}
.pg{width:min(1120px,calc(100vw - 32px));margin:0 auto;padding:92px 0 0;text-align:center}
.pg-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:36px;color:var(--mut);font-size:14px;text-decoration:none}

.pg-hero{padding:28px 0 66px}
.pg-title{font-size:var(--type-hero)}
.pg-sec{padding:34px 0}
.pg-sec h2{margin:0 0 14px;font-size:var(--type-h2);line-height:1.18;letter-spacing:-.015em}
.pg-sec>.pg-tip{max-width:var(--measure-prose);margin:0 auto 28px;color:var(--mut);line-height:1.65}
.pg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;text-align:left}
.pg-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pg-grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.pg-data{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;text-align:center}
.pg-data .pg-card{padding:30px 18px}
.pg-data strong{display:block;font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pg-data span{display:block;margin-top:10px;color:var(--mut);font-size:13.5px;line-height:1.5}
.pg-badge{display:inline-flex;align-items:center;margin-top:18px;padding:7px 13px;border:1px solid var(--bd);border-radius:var(--r-full);color:var(--mut);font-size:13px}
.pg-next{margin:68px auto 0;padding:34px 28px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-panel,var(--r-lg));box-shadow:var(--sh-1)}
.pg-next h2{margin:0;font-size:var(--type-h2)}
.pg-next p{margin:12px auto 0;max-width:var(--measure-prose);color:var(--mut);line-height:1.6}
.pg-next .lpx-cta-actions{margin-top:22px}
html[data-theme="dark"] .lpx-btn.primary{color:#0f1420}
@media (max-width:960px){
  .lpx-card-grid,.lpx-adv-grid,.pg-grid,.pg-data{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pg-grid.five{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  #lp-nav .lp-links{max-width:58vw}
  .lpx-section{padding:56px 0}
  .lpx-stat-grid,.lpx-card-grid,.lpx-adv-grid,.lp-footnav,.pg-grid,.pg-grid.two,.pg-grid.five,.pg-data{grid-template-columns:1fr}
  .lpx-banner{grid-template-columns:1fr;padding:30px 22px;text-align:center}
  .lpx-art{min-height:140px}
  .pg{padding-top:76px}
  .pg-hero{padding-bottom:46px}
}
@media (prefers-reduced-motion:reduce){
  .lpx-card,.pg-card,.lpx-btn{transition:none}
  .lpx-card:hover,.pg-card:hover,.lpx-btn:active{transform:none}
}
/* ═══════ R40:END ═══════ */
/* ═══════ R41:BEGIN 卡片二级详情展开层（landing 主要功能 6 卡 + 产品优势 3 卡：点卡片 → 行尾详情行展开）。
      作用域严格收口为 .lpx-card-grid / .lpx-adv-grid 的直接子 .lpx-card，不触碰 .pg-card 与其他视图。
      颜色走 --ac / --card / --bd / --tx / --mut / --sh-1 / --sh-ac，圆角走 --r-panel-sm / --r-md / --r-full，
      间距走 --sp-*，缓动走 --ease：零新增 hex、零外链、零字体声明，故无需 html[data-theme="dark"] 配套块。
      回滚 = 删除本注释对之间全部内容，并删除文末 R41 UI 标记之间的整个 script 块。 ═══════ */

/* 1) 为覆盖层按钮建立稳定包含块：卡片原生 position:static 时绝对定位会逃逸到外层祖先，
      而 hover 的 transform 又会临时改变包含块，两者不一致会造成覆盖层位置跳变 */
.lpx-card-grid>.lpx-card,.lpx-adv-grid>.lpx-card{position:relative}

/* 2) 覆盖层触发按钮：铺满卡片 padding box，提供原生键盘 / 焦点 / 点击；无可见文案（名称由 h3 提供）。
      position 用三级选择器压过 R21 引擎自动挂载的 .r21-b{position:relative}，不依赖 !important。
      color:var(--ac) 让 R21 涟漪取 currentColor 后呈品牌色；border-radius:inherit 让涟漪沿卡片圆角裁切 */
.lpx-card-grid>.lpx-card>.lpx-card-toggle,
.lpx-adv-grid>.lpx-card>.lpx-card-toggle{
  position:absolute;inset:0;z-index:1;
  width:auto;height:auto;margin:0;padding:0;border:0;
  background:transparent;color:var(--ac);
  border-radius:inherit;cursor:pointer;
  -webkit-appearance:none;appearance:none
}

/* 3) 展开态选中：强调色描边 + 图标反白 + 强调色阴影（0,3,0 稳定压过 .lpx-card:hover 的 0,2,0） */
.lpx-card-grid>.lpx-card.is-open,
.lpx-adv-grid>.lpx-card.is-open{border-color:var(--ac);box-shadow:var(--sh-ac)}
.lpx-card-grid>.lpx-card.is-open>.lpx-ico,
.lpx-adv-grid>.lpx-card.is-open>.lpx-ico{background:var(--ac);color:var(--card)}

/* 4) 卡内既有链接抬到覆盖层之上，保证照常跳转（仅「本地优先」卡存在一个 .lpx-more） */
.lpx-card-grid>.lpx-card>.lpx-more,
.lpx-adv-grid>.lpx-card>.lpx-more{position:relative;z-index:2}

/* 5) 展开 / 收起 指示箭头：置于卡片右上，静止保持克制，hover 与展开态才提亮 */
.lpx-card-toggle .lpx-card-cue{
  position:absolute;right:18px;top:20px;
  display:flex;align-items:center;justify-content:center;
  width:22px;height:22px;color:var(--mut);opacity:.45;
  transition:transform .28s var(--ease),opacity .2s var(--ease),color .2s var(--ease)
}
.lpx-card-toggle .lpx-card-cue svg{width:16px;height:16px}
.lpx-card:hover>.lpx-card-toggle .lpx-card-cue,
.lpx-card>.lpx-card-toggle:focus-visible .lpx-card-cue{color:var(--ac);opacity:1}
.lpx-card.is-open>.lpx-card-toggle .lpx-card-cue{color:var(--ac);opacity:1;transform:rotate(180deg)}

/* 6) 详情行：整行网格项，插到所点卡片所在行的末尾；高度由内联 max-height 驱动，0 起撑开。
      min-width:0 防长句撑破网格；overflow:hidden 是高度动画的裁切窗；align-self:start 避免拉伸参与测高 */
.lpx-detpanel{
  grid-column:1/-1;align-self:start;min-width:0;overflow:hidden;
  max-height:0;opacity:0;
  transition:max-height .36s var(--ease),opacity .26s var(--ease)
}
.lpx-detpanel.is-open{opacity:1}

/* 7) 详情内容盒：全部内边距放内层，外层只负责裁切，避免 padding 参与 max-height 造成测高偏差与收尾跳动。
      28px 与 .lpx-card 内边距一致，保证面板与上方卡片的左右内容基线对齐；
      margin-top 撑开与卡片的呼吸间隙（面板贴齐卡片底边，间隙只能由内层承担，否则会破坏零跳动） */
.lpx-det-in{
  margin-top:var(--sp-3);padding:28px;
  background:var(--card);border:1px solid var(--bd);
  border-radius:var(--r-panel-sm,var(--r-md));
  box-shadow:var(--sh-1);text-align:left
}
/* 展开态：面板沿用与选中卡片相同的强调色描边，明确「面板属于该卡片」的归属关系 */
.lpx-detpanel.is-open .lpx-det-in{border-color:var(--ac)}

/* 8) 操作行：了解更多（左）与收起（右）同排，与 .lpx-cta-actions 同款两端分布。
      收起按钮下移而非置于面板顶部，避免在标题区空出一整行、让面板显得像漂浮的独立卡片 */
.lpx-det-foot{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:var(--sp-3);margin-top:var(--sp-4)
}
.lpx-det-foot .lpx-det-link{margin-top:0}
.lpx-det-close{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;
  border:1px solid var(--bd);border-radius:var(--r-full);
  background:transparent;color:var(--tx);cursor:pointer;
  transition:color .2s var(--ease),border-color .2s var(--ease)
}
.lpx-det-close:hover{color:var(--ac);border-color:var(--ac)}
.lpx-det-close svg{width:16px;height:16px}

/* 9) 要点列表：字号行高对齐 .lpx-card p；悬挂式圆点让正文与卡片标题同一左基线 */
.lpx-det-list{list-style:none;margin:0;padding:0}
.lpx-det-list li{
  position:relative;margin-top:var(--sp-2);
  color:var(--mut);font-size:14.5px;line-height:1.65;
  text-wrap:pretty
}
.lpx-det-list li:first-child{margin-top:0}
.lpx-det-list li::before{
  content:"";position:absolute;left:-18px;top:.62em;
  width:6px;height:6px;border-radius:var(--r-full);background:var(--ac)
}

/* 10) 了解更多链接：镜像 .lpx-more 的表现，保持整站一致 */
.lpx-det-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:var(--sp-4);
  color:var(--ac);font-size:15px;font-weight:600;text-decoration:none
}
.lpx-det-link:hover{opacity:.72}

/* 11) 断点：≤640px 收紧圆点悬挂量，避免圆点进入面板边框内侧过深（沿用同断点既有口径） */
@media (max-width:640px){
  .lpx-det-list li::before{left:-14px}
}

/* 12) reduced motion：全站总闸之外再兜一层；JS 侧据此跳过 transitionend 等待，直接走收尾回调 */
@media (prefers-reduced-motion:reduce){
  .lpx-detpanel{transition:none}
  .lpx-card-toggle .lpx-card-cue{transition:none}
}
/* ═══════ R41:END ═══════ */
/* ═══════ R42:BEGIN 一级界面三大卡片迁移至二级界面 + 顶部常驻 GitHub 入口（20261101）
   范围：lpView() 摘除三张整宽大卡；内容归并进既有 landing 二级页并新建三级页 #/download/start；
        #lp-nav 与 #topbar 各加一枚 GitHub 出链按钮。
   纯追加 CSS：零外链、零新增依赖、零位图、零新增动画、本层零 hex（颜色全走既有令牌）。
   图标复用站内既有 Octicons mark-github 路径（见 ABOUT-UI SECTION_HTML 的 ab-ic-gh），零新增图形资源。

   〔迁移对照表〕一级首页 → 目的地，逐字搬运，零改写：
     .lp-product h2「喵星图 · 无限暖暖本地相册」      → #/features   pgShell title
     .lp-product .lp-product-desc 定位句              → #/features   pgShell lead
     .lp-product-points 三条要点                      → #/features   §1 三张 pg-card 的 p
     （被让位的既有文案 #/features 原 title/lead      → #/features   §1 的 h2 与 pg-tip，一句不丢）
     .lpx-resonance 主句「抽卡记录与衣橱，都在本地。」 → #/resonance  §1 h2
     .lpx-resonance 描述句                            → #/resonance  pgShell lead
     （被让位的 #/resonance 原 lead 系同义改写，随本次去重退场；「了解共鸣录」为一级首页专属自链，随卡片退场）
     .lpx-cta kicker/title/lead 三串                  → #/download/start 的 kicker/title/lead
     .lpx-cta-actions 两按钮文案                      → #/download/start 的 pg-next actions
     （#/download 原「常见问题」三卡整体迁入 #/download/start §2，属净去重）

   〔失效选择器登记〕以下规则本层起无消费者，有意保留以维持 R34/R40 注释对的独立回滚能力：
     .lp-product / .lp-product-desc / .lp-product-points（R19 层）
     .lpx-cta-card（R40 层）
     .lpx-banner / .lpx-art（R40 层，landing 与 #/resonance 两处用法均已撤除）

   回滚 = 删除本注释对之间的内容 + 删除 R42-VIEW 注释对 + 还原 lpView() / pgFeaturesView() /
         pgResonanceView() / pgDownloadView() / pgShell() / render() / R40-UI syncNav() /
         LP-NAV 与 topbar 两处静态 markup。整文件快照 Meow Star Map 官网.backup-r42-20261101.html。
   ═══════ R42 头注结束 ═══════ */

/* 1) 规范③图标与文字对齐：topbar 胶囊显式 inline-flex + 死尺寸图标，不靠默认 inline 基线；
      gap:5px 镜像 .rolelink（基础层）的对齐范式，二者在 62px 行内视觉同构 */
#topbar .ghlink{display:inline-flex;align-items:center;gap:5px}
#topbar .ghlink svg{width:16px;height:16px;flex:0 0 auto;display:block}

/* 2) lp-nav 圆钮：几何镜像 #lp-nav .lp-themebtn（32×32 圆 + 1px --bd 描边 + --card 底）。
      有意不写 color：让 .lp-links a 的 --mut/--tx 与 R34/R38 的主题态、data-lg-tone 令牌自然级联，
      避免特异度更高的他轮规则被本层写死色压出双套配色。
      padding 复位为 0 是必需的：.lp-links a 的 padding:6px 2px 会把 32px 圆钮内的图标顶偏心（规范④） */
#lp-nav .lp-gh{width:32px;height:32px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  margin:0;padding:0;border:1px solid var(--bd);border-radius:var(--r-full);background:var(--card);
  transition:border-color .2s var(--ease)}
#lp-nav .lp-gh:hover{border-color:var(--ac)}
#lp-nav .lp-gh svg{width:16px;height:16px;display:block}
#lp-nav .lp-gh:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* 3) 规范④/⑤导航溢出防护：.lp-links 为 gap:26px 的 flex，新增圆钮净增约 58px 占位。
      沿用 R36「窄屏隐藏配色圆点」既有口径（原 ≤560px）扩到 ≤900px，用约 100px 的圆点组吸收增量；
      768/900 档实测溢出归零。900px 与 640px 均为项目既有断点，本层不新造断点。
      ≤640px 再隐藏 #lp-dl-link：它与同栏 a[data-route="download"]「下载」及 hero 的「资源下载」
      三重重复，且 390px 档圆点已隐、无处再吸收（实测该档改造前即溢出 +46px，本轮一度加重到 +86px）。
      仅 display:none，markup 与 R21-UI 绑定原样保留，回滚只需删本条媒体查询 */
@media (max-width:900px){#lp-nav .lp-thdots{display:none}}
@media (max-width:640px){#lp-nav #lp-dl-link{display:none}}
/* 4) 390px 档的余量只能从容器宽度里要：#lp-links 原 max-width:58vw（R40 层）在该档只有 226px，
      而 .lp-links 是 overflow-x:auto + 滚动条隐藏，被裁项零提示。放宽到 66vw 后实测溢出 +74 → +43，
      优于改造前的 +46。上限 calc(100vw - 133px) 不可省：裸 66vw 在 360px 会把 .lp-brand 挤成
      三行（43 → 65px，超出 52px 固定栏高即破版），133px = 左右 padding 40 + 品牌两行所需 93 */
@media (max-width:640px){#lp-nav .lp-links{max-width:min(66vw,calc(100vw - 133px))}}

/* 4) 规范⑦/④间距两制统一：.pg-sec 有 pg-tip 时标题到网格为 28px，无 tip 时仅 h2 的 14px 下边距。
      三级页与迁移后的段落同时存在两种形态，补齐后一档 */
.pg-sec>h2+.pg-grid{margin-top:14px}

@media (prefers-reduced-motion:reduce){
  #lp-nav .lp-gh{transition:none}
}

/* ═══════ R43:BEGIN 软件图标层（20261101）：单一 data: 母图 + 1em 自适应占位。 ═══════
   母图 WebP 256² 只内联一次，经 :root 自定义属性供六处槽位共用；.app-ic 的宽高取 1em，
   故每处自动等于该槽位原字形的字号（导航 17 / 顶栏 20 / 侧栏 14.5 / 快捷卡 20~23 /
   工作台 13.5~14 / 身份门 36），尺寸·比例·显示位置与改造前一致。
   background-image 用长写：.q-emoji 与 .gate-emoji 的瓦片底色由更前的 background 简写设定，
   同特异度下本层只覆盖背景图，瓦片圆角·底色·描边原样保留。
   回滚 = 删除本注释对之间内容 + R43-ICON 注释对 + 还原六处图标字形。 */
:root{--app-icon:url("assets/app-icon.webp")}
.app-ic{display:inline-block;flex:none;width:1em;height:1em;vertical-align:-.15em;background-image:var(--app-icon);background-position:center;background-size:contain;background-repeat:no-repeat;border-radius:.18em}
html[data-look="plain"] .app-ic{filter:grayscale(1)}
/* ═══════ R43:END ═══════ */
/* ═══════ R45:BEGIN landing 暗底舞台作用域收口（R36 色点 × R40–R44 新增板块 · 20261101）═══════
   断层根因：R34 只给「当时存在」的板块做了暗底适配（.lp-eyebrow / .lp-sub / .lp-foot /
   .lp-hero::before 走 --lp-eyebrow-ink 等墨色接口，#lp-nav 与 .about-sec 与 .lp-cta 各有显式规则），
   而 R40–R44 新增的 .lpx- 族、.lp-footnav、.pg- 族、.lpx-det- 族与 R44 网盘行直接消费亮色令牌
   --tx / --mut / --bd / --card / --ac。lp-theme-energy 把 landing 底刷成 #0B0C10→#181A22、
   lp-theme-deep 刷成 #024F97→#1D6EB6（R34 L1584–1585）后实测对比度（浅色模式，WCAG 2.x）：
     --tx   1.36 / 1.21（energy） 1.76 / 1.10（deep） —— .lpx-title .pg-title .pg-sec h2
            .pg-data strong .lp-footnav h3 .lpx-btn.secondary 全部不可见；
     --mut  4.04 / 3.59          1.69 / 1.10 —— .lpx-kicker .lpx-lead .lpx-note .pg-kicker
            .pg-lead .pg-tip .pg-back .pg-badge .lp-footnav a .lp-footnote 全部不达标；
     --ac   4.30 / 3.82          1.80 / 1.17 —— .lpx-more .pg-link 在 deep 上不可见；
     .lp-gh 图标 vs 其自身 background:var(--card) 药丸 1.18 —— R42 的 GitHub 入口隐形。
   注意 .pg-sec h2 / .pg-next h2 / .pg-data strong / .lpx-card h3 / .pg-card h3 / .lp-dl-name

<script>
(function(){
"use strict";
/* ═══ R46:BEGIN 教程数据惰性解析（20261111）
   改造前：脚本顶层无条件 JSON.parse(#tut-data) 30.9 MB —— 落地页 #/、身份门、开发者视图
   同样要付一次约 59 MB 的 UTF-16 字符串与解析后的对象图，而它们一个字节都不使用。
   改造后：仅教程路由（#/tutorial、#/all、#/mX、#/mX/mYpZ）与首次搜索时才解析，其余入口零解析。
   MODS/ORDER/byId/modById 仍是同一批对象引用，只由 ensureTut() 填充，故所有下游闭包零改动。
   回滚 = 删除本注释对之间的函数，并还原下列调用点（各带 R46 标记）与 USER_SB 惰性化。 ═══ */
/* ═══ 多文件版数据层（本分支无视单文件约束）
   教程数据 data/tutorial.js 与开发文档 data/dev-docs.js 全部外置，落地页只加载 shell。
   两者都是 classic script（非 module）+ 普通 <img src>，因此 file:// 直开与 HTTP 均可用。 */
var DATA=null, MODS=null, ORDER=[], byId={}, modById={}, DEV=null;
var _tutState=0, _devState=0;
function needsTut(){var h=(location.hash||'#/').slice(1).split('@')[0];return h==='/all'||h==='/tutorial'||/^\/m\d+(\/|$)/.test(h);}
function needsDev(){var h=(location.hash||'#/').slice(1).split('@')[0];return h==='/dev'||h.indexOf('/dev/')===0;}
function loadScriptOnce(src,onOk,onErr){
  var s=document.createElement('script');
  s.src=src; s.async=true;
  s.onload=onOk;
  s.onerror=onErr;
  document.head.appendChild(s);
}
function ensureTut(){
  if(DATA) return true;
  if(_tutState===1) return false;
  _tutState=1;
  loadScriptOnce('data/tutorial.js',function(){
    DATA=window.__TUT__||null;
    if(!DATA){ _tutState=0; return; }
    MODS=DATA.modules;
    MODS.forEach(function(m){modById[m.id]=m;});
    MODS.forEach(function(m){m.pages.forEach(function(pid){ORDER.push({m:m,pid:pid,p:DATA.pages.find(function(x){return x.id===pid;})});});});
    ORDER.forEach(function(o){byId[o.pid]=o;});
    USER_SB=null; sbFamily=''; _tutState=2;
    if(needsTut()) render();
  },function(){ _tutState=0; });
  return false;
}
function ensureDev(){
  if(DEV) return true;
  if(_devState===1) return false;
  _devState=1;
  loadScriptOnce('data/dev-docs.js',function(){
    DEV=window.__DEV__||null;
    if(!DEV){ _devState=0; return; }
    buildDevIndexes();
    DEV_SB=buildDevSb(); _devState=2;
    if(needsDev()) render();
  },function(){ _devState=0; });
  return false;
}
var lowCache={};
function low(s){ if(!(s in lowCache)) lowCache[s]=s.toLowerCase(); return lowCache[s]; }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
/* ── 图片骨架外壳：img 包入 .img-shell，load 后淡入，error 显示失败空态（#/all 不处理以控性能） ── */
function wrapImgShells(html){
  if(!html||html.indexOf('<img')<0)return html;
  /* R48：教程页截图补 loading="lazy" + decoding="async"。
     改造前 48 张图注入即全部解码，每张 1400x900 解码后约 5 MB 位图（一页 3 张 ≈ 15 MB）；
     惰性解码后视口外图片不再即时解码。已显式声明该属性的 img 不覆盖。 */
  return html.replace(/<img\b[^>]*>/g,function(m){
    var extra='';
    if(!/\sloading\s*=/.test(m)) extra+=' loading="lazy"';
    if(!/\sdecoding\s*=/.test(m)) extra+=' decoding="async"';
    return '<span class="img-shell">'+m.replace(/\s*\/?>$/,extra+'>')+'</span>';
  });
}
function hydrateShells(){
  app.querySelectorAll('.img-shell img').forEach(function(im){
    if(im.complete&&im.naturalWidth>0){var sh=im.closest('.img-shell');if(sh)sh.classList.add('ld');}
  });
}
/* ── 首页封面网格：把 DATA.home 的 .mod-grid 文字卡升级为「截图封面网格」（严格等宽等高 3×3）。
   任一异常整体抛出 → home 分支回退渲染原始 DATA.home；单卡封面缺失 → 降级纯文字卡。
   封面只接受 data:image/ 内嵌 src，杜绝外链注入；结果缓存避免重复变换。 ── */
var _homeGridCache=null;
function firstCoverSrc(mid){
  var m=modById[mid]; if(!m||!m.pages)return null;
  for(var i=0;i<m.pages.length;i++){
    var o=byId[m.pages[i]]; if(!o||!o.p)continue;
    var mt=String(o.p.html||'').match(/<img\b[^>]*\bsrc="(data:image\/[^"]+)"/i);
    if(mt)return mt[1];
  }
  return null;
}
function buildHomeGrid(){
  if(_homeGridCache)return _homeGridCache;
  var doc=new DOMParser().parseFromString(DATA.home,'text/html');
  var grid=doc.querySelector('.mod-grid');
  if(!grid)throw new Error('home: .mod-grid not found');
  var cards=grid.querySelectorAll('.mod-card');
  if(cards.length!==MODS.length)throw new Error('home: mod-card count '+cards.length+' !== '+MODS.length);
  var out='';
  cards.forEach(function(card,i){
    var href=card.getAttribute('href')||'#/';
    var mid=href.replace(/^#\//,'');
    var txt=function(sel){var el=card.querySelector(sel);return el?el.textContent.trim():'';};
    var src=null;
    try{src=firstCoverSrc(mid);}catch(e){}
    out+='<a class="ms-card" href="'+esc(href)+'">'
      +(src?'<span class="img-shell ms-cover"><img src="'+esc(src)+'" alt="'+esc(txt('.mc-name'))+'" loading="lazy" decoding="async"></span>':'<span class="ms-cover ms-cover-ph" aria-hidden="true">'+esc(txt('.mc-emoji'))+'</span>')
      +'<span class="ms-body"><span class="ms-head"><span class="ms-emoji">'+esc(txt('.mc-emoji'))+'</span><span class="ms-name">'+esc(txt('.mc-name'))+'</span></span>'
      +(txt('.mc-desc')?'<span class="ms-desc">'+esc(txt('.mc-desc'))+'</span>':'')
      +(txt('.mc-count')?'<span class="ms-count">'+esc(txt('.mc-count'))+'</span>':'')
      +'</span></a>';
  });
  var wall=doc.createElement('div'); wall.className='cover-grid'; wall.innerHTML=out;
  grid.parentNode.replaceChild(wall,grid);
  _homeGridCache=doc.body.innerHTML;
  return _homeGridCache;
}
/* ── 身份状态（第 1 级门控）：user=用户教程 / dev=开发者工作台，选择持久化到 localStorage ── */
var ROLE_KEY='nikki_role';
function getRole(){ try{return localStorage.getItem(ROLE_KEY)||null;}catch(e){return null;} }
function setRole(r){ try{localStorage.setItem(ROLE_KEY,r);}catch(e){} }
function pick(r){
  setRole(r);
  var t=(r==='dev')?'#/dev':'#/tutorial';
  if(location.hash===t){render();}else{location.hash=t;}
}

var sb=document.getElementById('sidebar');
/* R46：教程侧栏由加载期 IIFE 改为惰性构建 —— 它依赖 MODS/byId，原实现会在首帧强制解析 30.9 MB。
   现在仅在教程视图首次渲染时构建一次并缓存为字符串；落地页/身份门不构建（该视图下侧栏本就隐藏）。 */
var USER_SB=null;
function buildUserSb(){
  if(USER_SB!==null) return USER_SB;
  if(!DATA) return '';
  var h='<a class="sb-home" href="#/tutorial">🏠 <span>首页总览</span></a>';
  h+='<a class="sb-all" href="#/all">📖 连续阅读完整教程</a><div class="sb-mods">';
  MODS.forEach(function(m){
    h+='<div class="sb-mod" data-m="'+m.id+'"><a class="sb-modlink" href="#/'+m.id+'">'
      +'<span>'+m.emoji+' '+esc(m.name)+'</span><span class="chev">▶</span></a><div class="sb-pages">';
    m.pages.forEach(function(pid){
      h+='<a href="#/'+m.id+'/'+pid+'">'+esc(byId[pid].p.title)+'</a>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  USER_SB=h;
  return h;
}
/* 多文件版：开发者侧栏同样惰性构建（DEV 数据按需加载） */
var DEV_SB=null;
function buildDevSb(){
  if(DEV_SB!==null) return DEV_SB;
  if(!DEV) return '';

  
  var h='<a class="sb-home" href="#/dev">🛠️ <span>开发者工作台</span></a>';
  h+='<a class="sb-all" href="#/tutorial"><span class="app-ic" aria-hidden="true"></span>用户使用教程</a><div class="sb-mods">';
  DEV.cats.forEach(function(c){
    h+='<div class="sb-mod" data-m="'+c.id+'"><a class="sb-modlink" href="#/dev/'+c.id+'">'
      +'<span>'+c.emoji+' '+esc(c.name)+'</span><span class="chev">▶</span></a><div class="sb-pages">';
    (c.pages||[]).forEach(function(pid){
      h+='<a href="#/dev/'+c.id+'/'+pid+'">'+esc(DEV.docs[pid].title)+'</a>';
    });
    (c.groups||[]).forEach(function(g){
      h+='<a class="sb-grp" href="#/dev/'+c.id+'/'+g.id+'">📂 '+esc(g.name)+'</a>';
      (g.pages||[]).forEach(function(pid){
        h+='<a href="#/dev/'+c.id+'/'+g.id+'/'+pid+'">'+esc(DEV.docs[pid].title)+'</a>';
      });
    });
    h+='</div></div>';
  });
  h+='</div>';
  return h;
  DEV_SB=h;
  return h;
}

var sbFamily='';
function syncSidebar(family){
  if(sbFamily===family)return;
  sbFamily=family;
  /* R46：USER_SB 惰性化；dev 侧栏仍沿用加载期构建的 DEV_SB（dev-data 仅 1.5 MB） */
  sb.innerHTML=(family==='dev')?(DEV_SB||buildUserSb()):buildUserSb();
}

function crumbs(items){
  return '<nav class="crumbs">'+items.map(function(it){
    return it[1]?('<a href="'+it[1]+'">'+esc(it[0])+'</a>'):'<span class="cur">'+esc(it[0])+'</span>';
  }).join('<span class="sep">›</span>')+'</nav>';
}

/* ── 开发者路径渲染模块：L2 工作台 / L3 板块 / L4 子分类 / L5 文档详情 ── */
var devCatById={}, devGrpById={}, devDocById={};
function buildDevIndexes(){
  if(!DEV) return;
  DEV.cats.forEach(function(c){
    devCatById[c.id]=c;
    (c.pages||[]).forEach(function(pid){ devDocById[pid]={d:DEV.docs[pid],cat:c,grp:null}; });
    (c.groups||[]).forEach(function(g){
      devGrpById[g.id]=g;
      (g.pages||[]).forEach(function(pid){ devDocById[pid]={d:DEV.docs[pid],cat:c,grp:g}; });
    });
  });
}
function devFlatDocs(cat){
  var out=(cat.pages||[]).slice();
  (cat.groups||[]).forEach(function(g){ out=out.concat(g.pages||[]); });
  return out;
}
function devDocHref(pid){
  var en=devDocById[pid];
  return en?('#/dev/'+en.cat.id+(en.grp?('/'+en.grp.id):'')+'/'+pid):('#/dev');
}
function devWan(n){ return n>=10000?((n/10000).toFixed(1)+' 万'):String(n); }
function devHome(){
  var s=DEV.stats||{};
  var cards=DEV.cats.map(function(c){
    var n=(c.pages||[]).length+(c.groups||[]).reduce(function(a,g){return a+(g.pages||[]).length;},0);
    return '<a class="mod-card" href="#/dev/'+c.id+'"><span class="mc-emoji">'+c.emoji+'</span>'
      +'<span class="mc-name">'+esc(c.name)+(c.kb?'<span class="kb-chip">知识库</span>':'')+'</span>'
      +'<span class="mc-desc">'+esc(c.desc)+'</span>'

function devDocPage(en){

function lpEnhance(){
  var els=app.querySelectorAll('.lp-fade');
  if(!els.length)return;
  var rm=false;
  try{rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(rm||!('IntersectionObserver' in window)){
    els.forEach(function(el){el.classList.add('is-in');});
    return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){en.target.classList.add('is-in');io.unobserve(en.target);}
    });
  },{threshold:.12});
  els.forEach(function(el){io.observe(el);});
}

/* R8 P23 漂浮几何视差：滚动帧内对 #atmos 容器做有上限的 translate3d（无层则空操作；
   reduced-motion 不接线；位移上限 120px 与容器 140px 预留量匹配，见八次精修层 P23。回滚=删除本注释至函数结束） */
var atmosEl=null;
function atmosSync(y){
  if(reduceMotion)return;
  if(!atmosEl||!atmosEl.isConnected)atmosEl=document.getElementById('atmos');
  if(!atmosEl)return;
  atmosEl.style.transform='translate3d(0,'+Math.min((y||0)*.06,120).toFixed(1)+'px,0)';
}
var ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var v=document.body.getAttribute('data-view')||'home';
    var y=window.scrollY||window.pageYOffset||0;
    if(topbar)topbar.classList.toggle('scrolled',y>8&&v!=='identity');
    var lr=(v!=='identity')&&longReadView();
    if(readbar){
      var max=document.documentElement.scrollHeight-window.innerHeight;
      readbar.style.transform='scaleX('+((lr&&max>0)?Math.min(1,Math.max(0,y/max)):0)+')';
    }
    if(totop)totop.classList.toggle('on',!!(lr&&y>window.innerHeight));
    /* R8 P23 漂浮几何视差同步 */
    atmosSync(y);
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll,{passive:true});

/* P6 卡片指针聚光灯：仅精确指针设备，CSS 变量驱动，事件委托 */
var SPOT='.ms-card,.mod-card,.pagecard,.quick,.step,.gate-role';
if(finePointer){
  document.addEventListener('pointermove',function(e){
    var t=e.target&&e.target.closest?e.target.closest(SPOT):null;
    if(!t)return;
    var r=t.getBoundingClientRect();
    if(!r.width||!r.height)return;
    t.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(2)+'%');
    t.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(2)+'%');
  },{passive:true});
}

/* P7 环境光斑漂移层（低动效不注入；与 body::before 静态光斑同色系） */
if(!reduceMotion&&!docEl.querySelector('#bg-blobs')){
  var blobs=document.createElement('div');blobs.id='bg-blobs';blobs.setAttribute('aria-hidden','true');
  for(var bi=1;bi<=4;bi++){var bel=document.createElement('i');bel.className='b'+bi;blobs.appendChild(bel);}
  document.body.insertBefore(blobs,document.body.firstChild);
}

/* P8 dev 板块过滤零结果空态：追加监听，主处理器完成显隐后统计可见项（不改原逻辑） */
var fltEmpty=null;
function fltCleanup(){if(fltEmpty&&fltEmpty.parentNode)fltEmpty.parentNode.removeChild(fltEmpty);fltEmpty=null;}
function fltEnsure(){
  var input=app.querySelector('[data-dev-filter]');
  if(!input)return;
  var q=(input.value||'').trim(),total=0,shown=0;
  var list=app.querySelectorAll('.dev-flt');
  for(var i=0;i<list.length;i++){total++;if(list[i].style.display!=='none')shown++;}
  if(q&&total>0&&shown===0){
    if(!fltEmpty){
      fltEmpty=document.createElement('div');
      fltEmpty.className='empty-ill flt-empty';
      fltEmpty.innerHTML='<svg viewBox="0 0 64 64" width="52" height="52" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="15" stroke="#c7d2e5" stroke-width="3.5"/><path d="M39.5 39.5L52 52" stroke="#c7d2e5" stroke-width="4" stroke-linecap="round"/><path d="M21.5 28a6.5 6.5 0 0 1 6.5-6.5" stroke="#9fb4d8" stroke-width="3" stroke-linecap="round"/></svg>'
        +'<b>没有匹配的文档</b><span>换个关键词试试，或清除筛选查看本板块全部内容</span>'
        +'<button type="button" class="alllink" data-flt-clear>清除筛选</button>';
      fltEmpty.querySelector('[data-flt-clear]').addEventListener('click',function(){
        input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));try{input.focus();}catch(e){}
      });
    }
    var row=app.querySelector('.dev-filterrow');
    if(row&&fltEmpty.parentNode!==row.parentNode)row.insertAdjacentElement('afterend',fltEmpty);
  }else{fltCleanup();}
}
app.addEventListener('input',function(e){
  if(!e.target||!e.target.closest||!e.target.closest('[data-dev-filter]'))return;
  window.setTimeout(function(){fltEnsure();refreshST();},0);
});

/* P5 GSAP 入场编排：killList 管理滚动触发的生命周期，防止跨视图泄漏 */
var killList=[];
function killTriggers(){while(killList.length){try{killList.pop().kill();}catch(e){}}}
var stTimer=0;
function refreshST(){
  if(!window.ScrollTrigger||reduceMotion)return;
  window.clearTimeout(stTimer);
  stTimer=window.setTimeout(function(){try{ScrollTrigger.refresh();}catch(e){}},220);
}
function clearMotionProps(){
  try{
    /* R18：landing 视图无网格/正文容器，空集合直接跳过，避免 GSAP "target not found" 警告 */
    var _cmp=app.querySelectorAll('.page-body *,.cover-grid>*,.mod-grid>*,.pagecards>*,.quick-grid>*,.gate-roles>*');
    if(_cmp.length)gsap.set(_cmp,{clearProps:'opacity,transform'});
  }catch(e){}
}
function enhance(){
  var canRun=!reduceMotion&&!!window.gsap&&!!window.ScrollTrigger;
  docEl.classList.toggle('g-ok',canRun);
  killTriggers();
  if(!canRun)return;
  try{gsap.registerPlugin(ScrollTrigger);}catch(e){docEl.classList.remove('g-ok');return;}
  var v=document.body.getAttribute('data-view')||'home';
  var root=app.firstElementChild;
  try{
    if(root){
      var tl=gsap.timeline({defaults:{ease:'power2.out',clearProps:'opacity,transform'}});
      tl.from(root,{opacity:0,y:10,duration:.3});
      if(v!=='all'){
        var grids=app.querySelectorAll('.cover-grid,.mod-grid,.pagecards,.quick-grid,.gate-roles');
        for(var gi=0;gi<grids.length;gi++){
          var kids=Array.prototype.slice.call(grids[gi].children);
          if(kids.length)tl.from(kids,{opacity:0,y:14,duration:.45,stagger:.035},'-=0.12');
        }
      }
    }
  }catch(err){}
  /* 详情正文滚动显现：先置隐再由 batch 释放；任何异常立即还原，杜绝“内容消失” */
  try{
    if(v!=='all'){
      var bodies=app.querySelectorAll('.page-body');
      for(var bb=0;bb<bodies.length;bb++){
        var items=Array.prototype.slice.call(bodies[bb].children);
        if(!items.length||items.length>80)continue;
        gsap.set(items,{opacity:0,y:14});
        ScrollTrigger.batch(items,{start:'top 92%',once:true,onEnter:function(batch){
          gsap.to(batch,{opacity:1,y:0,duration:.5,stagger:.05,ease:'power2.out',clearProps:'opacity,transform',overwrite:true});
        }});
      }
    }
  }catch(err2){
    clearMotionProps();
  }
  onScroll();
}
/* 图片解码后文档高度变化 → 校准滚动触发位置与阅读进度比例（捕获委托；R7 D3：scrollHeight 变化后同步重算进度条） */
app.addEventListener('load',function(e){
  if(e.target&&e.target.tagName==='IMG'){refreshST();onScroll();}
},true);

/* P20 长视图图片懒解码：#/all（179 页连续阅读）渲染后同一任务内标记 loading=lazy，解码压力后移至接近视口时；
   其余视图补 decoding=async 降低解码优先级。仅设置属性、不改动任何渲染逻辑，异常静默跳过。 */
function tuneImgs(){
  try{
    var v=document.body.getAttribute('data-view')||'';
    var imgs=app.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      if(v==='all'&&!imgs[i].getAttribute('loading'))imgs[i].setAttribute('loading','lazy');
      if(!imgs[i].getAttribute('decoding'))imgs[i].setAttribute('decoding','async');
    }
  }catch(e){}
}
window.addEventListener('hashchange',function(){
  fltCleanup();
  enhance();
  tuneImgs();
  onScroll();
});

/* 低动效偏好运行时切换：立即停用动画层并还原内联样式 */
function onRmChange(){
  reduceMotion=!!(rmq&&rmq.matches);
  if(reduceMotion){
    docEl.classList.remove('g-ok');
    killTriggers();
    try{if(window.gsap)clearMotionProps();}catch(e){}
    var bl=docEl.querySelector('#bg-blobs');
    if(bl&&bl.parentNode)bl.parentNode.removeChild(bl);
    onScroll();
  }
}
try{
  if(rmq){
    if(rmq.addEventListener)rmq.addEventListener('change',onRmChange);
    else if(rmq.addListener)rmq.addListener(onRmChange);
  }
}catch(e){}

/* 首次增强：主脚本 render() 已在本块之前同步完成（首次 hash 可为 #/all，故同样执行图片调优） */
enhance();
tuneImgs();
onScroll();
})();
</script>
<!-- ENHANCE:END -->
<!-- THEME-UI:BEGIN（R7 主题切换钮：浅色 → 深色 → 跟随系统 三态循环，记忆于 localStorage.nikki_theme；
     整体 try/catch，localStorage/matchMedia 异常时静默降级为系统偏好。回滚 = 删除本注释对之间内容。） -->
<script>
(function(){
"use strict";
try{
  var KEY='nikki_theme';
  var mqm=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  var btns=[];
  function pref(){try{return localStorage.getItem(KEY)||'auto';}catch(e){return 'auto';}}
  function sysDark(){return !!(mqm&&mqm.matches);}
  function apply(){
    var p=pref(),t=(p==='auto')?(sysDark()?'dark':'light'):p;
    if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
  }
  var META={
    light:{icon:'\u2600\uFE0F',label:'浅色',next:'切换到深色模式'},
    dark:{icon:'\uD83C\uDF19',label:'深色',next:'切换到跟随系统'},
    auto:{icon:'\uD83C\uDF13',label:'跟随系统',next:'切换到浅色模式'}
  };
  function paint(){
    var m=META[pref()]||META.auto;
    btns.forEach(function(btn){
      btn.textContent=m.icon;
      btn.title='主题：'+m.label+'（点击'+m.next+'）';
      btn.setAttribute('aria-label','当前主题：'+m.label+'，'+m.next);
    });
  }
  /* R18：工厂化双挂载 —— topbar 实例保留 id="themebtn"（测试依赖），lp-nav 实例仅 class（避免重复 id） */
  function make(host,id){
    var btn=document.createElement('button');
    btn.type='button';
    if(id)btn.id=id;else btn.className='lp-themebtn';
    btn.addEventListener('click',function(){
      var order=['light','dark','auto'];
      var nxt=order[(order.indexOf(pref())+1)%order.length];
      try{if(nxt==='auto'){localStorage.removeItem(KEY);}else{localStorage.setItem(KEY,nxt);}}catch(e){}
      apply();paint();
      /* R8 P22 主题切换 Toast 反馈（回滚=删除本行） */
      try{if(window.__toast)window.__toast('主题已切换：'+((META[nxt]||META.auto).label),{variant:nxt==='dark'?'dv':'ac'});}catch(e){}
    });
    host.appendChild(btn);
    btns.push(btn);
    return btn;
  }
  var topbar=document.getElementById('topbar');
  if(topbar){
    var tb=make(topbar,'themebtn');
    var anchor=topbar.querySelector('.rolelink');
    if(anchor)topbar.insertBefore(tb,anchor);
  }
  var lpLinks=document.querySelector('#lp-nav .lp-links');
  if(lpLinks)make(lpLinks,null);
  if(!btns.length)return;
  var onSys=function(){if(pref()==='auto')apply();};
  if(mqm){if(mqm.addEventListener)mqm.addEventListener('change',onSys);else if(mqm.addListener)mqm.addListener(onSys);}
  apply();paint();
}catch(e){}
})();
</script>
<!-- THEME-UI:END -->
<!-- ATM-UI:BEGIN（R8 漂浮几何氛围层：注入 #atmos（5 件几何体，样式/定位/降级见八次精修层 P23）；
     置于 #bg-blobs 之后（同 z-index:-2 域、DOM 序在后）；整体 try/catch 失败静默。回滚 = 删除本注释对之间内容。） -->
<script>
(function(){
"use strict";
try{
  if(document.getElementById('atmos'))return;
  var layer=document.createElement('div');
  layer.id='atmos';layer.setAttribute('aria-hidden','true');
  var CLS=['atm-ring','atm-ring2','atm-tri','atm-sq','atm-dot'];
  for(var i=0;i<CLS.length;i++){var s=document.createElement('i');s.className=CLS[i];layer.appendChild(s);}
  var blobs=document.getElementById('bg-blobs');
  if(blobs&&blobs.parentNode&&blobs.nextSibling)blobs.parentNode.insertBefore(layer,blobs.nextSibling);
  else if(blobs&&blobs.parentNode)blobs.parentNode.appendChild(layer);
  else document.body.insertBefore(layer,document.body.firstChild);
}catch(e){}
})();
</script>
<!-- ATM-UI:END -->
<!-- TOAST-UI:BEGIN（R8 Toast 通知：玻璃质感单条队列、aria-live=polite、默认 2.8s 自动消退；
     暴露 window.__toast(msg, opts)，opts={variant:'ac'|'dv', duration}。整体 try/catch 失败静默。
     回滚 = 删除本注释对之间内容。） -->
<script>
(function(){
"use strict";
try{
  if(window.__toast)return;
  var reduceMotion=false;
  try{reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){}
  var host=null;
  function ensure(){
    if(host&&host.isConnected)return host;
    host=document.createElement('div');
    host.id='toast';host.setAttribute('aria-live','polite');host.setAttribute('aria-atomic','false');
    document.body.appendChild(host);
    return host;
  }
  function toast(msg,opt){
    try{
      opt=opt||{};
      var box=ensure();
      while(box.children.length>=3)box.removeChild(box.firstChild);
      var el=document.createElement('div');
      el.className='toast-item'+(opt.variant==='dv'?' t-dv':'');
      var dot=document.createElement('i');dot.className='toast-dot';dot.setAttribute('aria-hidden','true');
      var tx=document.createElement('span');tx.textContent=String(msg==null?'':msg);
      el.appendChild(dot);el.appendChild(tx);
      box.appendChild(el);
      var dur=(typeof opt.duration==='number')?opt.duration:2800;
      window.setTimeout(function(){el.classList.add('in');},20);
      window.setTimeout(function(){
        el.classList.add('out');
        window.setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},reduceMotion?80:360);
      },dur);
      return el;
    }catch(e){return null;}
  }
  window.__toast=toast;
}catch(e){}
})();
</script>
<!-- TOAST-UI:END -->
